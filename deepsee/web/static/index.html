<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>deepsee — 让纯文本模型看图 · 画图</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">deepsee</span>
        <span class="brand-tag">让纯文本模型看图 · 画图</span>
      </div>
      <div class="topbar-right">
        <span class="status-chip" id="chainChip" data-state="loading"><i></i><span id="chainChipText">视觉链路检测中…</span></span>
      </div>
    </header>

    <section class="pipeline" id="pipeline" aria-label="转换流程">
      <span class="pnode"><span class="pnode-ic">◫</span>图片</span>
      <span class="plink"><span class="flowdot" aria-hidden="true"></span></span>
      <span class="pnode pnode-mid" id="pnodeVision"><span class="pnode-ic">◎</span><span id="visionLabel">视觉模型</span></span>
      <span class="plink"><span class="flowdot" aria-hidden="true"></span></span>
      <span class="pnode"><span class="pnode-ic">▤</span>DeepSeek</span>
    </section>

    <main class="grid">
      <!-- 识图台 -->
      <section class="panel panel-see">
        <header class="panel-h">
          <h2>识图台 <span class="en">See</span></h2>
          <span class="mode-switch" role="group" aria-label="识图模式">
            <button type="button" data-mode="describe" class="active">describe</button>
            <button type="button" data-mode="ocr">ocr</button>
            <button type="button" data-mode="qa">qa</button>
          </span>
        </header>

        <div class="dropzone" id="dropzone">
          <input id="fileInput" type="file" accept="image/*" hidden>
          <p class="dz-hint">把图片拖进来,或 <strong>Ctrl+V</strong> 直接粘贴,或选择下面一种来源:</p>
          <div class="dz-actions">
            <button class="btn" id="pickBtn" type="button">选择图片</button>
            <button class="btn btn-ghost" id="clipBtn" type="button">取最近截图</button>
          </div>
          <input class="field" id="urlInput" placeholder="或贴入本地图片路径 / http(s) 网址">
        </div>

        <div class="qa-row">
          <input class="field" id="questionInput" placeholder="可选:针对图片提问(qa 模式生效)">
        </div>

        <div class="see-actions">
          <button class="btn btn-primary btn-cool" id="seeBtn" type="button">识别这张图</button>
          <span class="meta" id="seeMeta"></span>
        </div>
        <div class="output" id="seeOutput" hidden></div>
      </section>

      <!-- 画图台 -->
      <section class="panel panel-gen">
        <header class="panel-h">
          <h2>画图台 <span class="en">Gen</span></h2>
        </header>
        <textarea class="field" id="genPrompt" rows="3"
                  placeholder="描述你想生成的图…&#10;例如:一只在月球上打篮球的柴犬,赛博朋克风"></textarea>
        <div class="gen-actions">
          <button class="btn btn-primary btn-warm" id="genBtn" type="button">生成</button>
          <span class="meta" id="genMeta"></span>
        </div>
        <div class="gen-result" id="genResult" hidden>
          <img id="genImg" alt="生成结果">
          <p class="path" id="genPath"></p>
        </div>
      </section>

      <!-- 状态 -->
      <section class="panel panel-status">
        <header class="panel-h">
          <h2>状态 <span class="en">Status</span></h2>
        </header>
        <dl class="kv" id="statusList"></dl>
        <ul class="problems" id="problems"></ul>
      </section>

      <!-- 配置 -->
      <section class="panel panel-config">
        <header class="panel-h">
          <h2>配置 <span class="en">Config</span></h2>
          <button class="btn btn-ghost" id="editCfgBtn" type="button">编辑</button>
        </header>
        <pre class="code" id="cfgView"></pre>
        <div id="cfgEdit" hidden>
          <textarea class="field code-area" id="cfgText" rows="10" spellcheck="false"></textarea>
          <div class="config-actions">
            <button class="btn btn-primary btn-cool" id="saveCfgBtn" type="button">保存配置</button>
            <span class="meta" id="cfgMeta"></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>

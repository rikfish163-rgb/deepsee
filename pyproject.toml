[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上 deepsee 已被占用,分发名用 deepsee-mcp(命令与导入包仍叫 deepsee)
name = "deepsee-mcp"
version = "0.2.0"
description = "给 DeepSeek 等纯文本模型补齐图片理解能力：MCP、双协议代理、CLI、Hook 与 Web 面板"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hetaisheng" }]
keywords = ["deepseek", "vision", "mcp", "claude-code", "codex", "image", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rikfish163-rgb/deepsee"
Repository = "https://github.com/rikfish163-rgb/deepsee"
Documentation = "https://github.com/rikfish163-rgb/deepsee/blob/main/docs/CONFIGURATION.md"

[project.optional-dependencies]
# MCP 服务器官方 SDK（可选，不装则用手写轻量 stdio 服务器）
mcp = ["mcp>=1.0"]
# 图片缩放加速（可选，省 token/费用）
image = ["Pillow>=9.0"]
# 本地离线 OCR（免 API key 提取图片文字）
ocr = ["rapidocr-onnxruntime>=1.3", "numpy", "Pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
deepsee = "deepsee.cli:main"
dsv = "deepsee.cli:main"

[tool.setuptools.packages.find]
include = ["deepsee*"]

[tool.setuptools.package-data]
"deepsee.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
